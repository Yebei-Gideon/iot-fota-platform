name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: 'postgresql://postgres.nodewave:postgres@localhost:6543/fotadevdb?pgbouncer=true'
          DIRECT_URL: 'postgresql://postgres.nodewave:postgres@localhost:5432/fotadevdb'
          SHADOW_DATABASE_URL: 'postgresql://postgres.nodewave:postgres@localhost:5432/fotashadowdb'
        run: bun --filter @fota/database db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck
