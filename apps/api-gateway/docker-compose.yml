services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fota_api_gateway
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3030:3030'
    env_file:
      - .env.production
    networks:
      - fota-network
networks:
  fota-network:
    driver: bridge
