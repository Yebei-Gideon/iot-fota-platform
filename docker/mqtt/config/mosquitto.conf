# Global Settings
per_listener_settings true
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

# Listener 1: Standard MQTT listener (non-TLS)
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords

# Listener 2: WebSockets
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwords

# Listener 3: TLS listener
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords
cafile /mosquitto/certs/ca/ca.crt
certfile /mosquitto/certs/server/server.crt
keyfile /mosquitto/certs/server/server.key
tls_version tlsv1.2

# Enforce client certificates (mutual TLS) - Uncomment if needed later
# require_certificate true
# use_identity_as_username true
